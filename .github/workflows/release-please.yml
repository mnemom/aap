name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read # the App token (not GITHUB_TOKEN) performs the release commit/PR writes
    steps:
      # release-please opens/updates a release PR. The default GITHUB_TOKEN is
      # blocked by the org policy "Allow GitHub Actions to create and approve
      # pull requests" (run 26766452355 failed: "GitHub Actions is not permitted
      # to create or approve pull requests"). Authenticate as the org release
      # GitHub App instead — a distinct identity not subject to that Actions-token
      # policy. Mirrors the deploy repo's create-github-app-token convention.
      # `client-id` is the current name for the input that used to be `app-id`: the action
      # reads `client-id || app-id` into one slot, and GitHub accepts an App ID or a Client
      # ID as the JWT `iss`, so this secret's value stays valid under the new key.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.MNEMOM_RELEASE_APP_ID }}
          private-key: ${{ secrets.MNEMOM_RELEASE_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
