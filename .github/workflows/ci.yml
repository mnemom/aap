name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge-queue trigger (MNE-1213). Required checks must run in the
  # merge_group context for this repo to be eligible for a merge queue, the
  # way mnemom-platform/ci.yml already is. The deploy step stays gated to
  # `github.event_name == 'push'`, so no deploy fires on merge_group events.
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies (frozen, from uv.lock)
        run: uv sync --locked --extra dev

      # mypy is pinned to python_version=3.10 in [tool.mypy], so its result is
      # identical across the matrix — run it once (on 3.12) as a required gate.
      - name: Type check (mypy strict)
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev mypy src/

      - name: Run tests with coverage
        run: |
          uv run --locked --extra dev pytest tests/ --cov=src/aap --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false
          verbose: true

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Type check
        working-directory: typescript
        run: npm run typecheck

      - name: Run tests with coverage
        working-directory: typescript
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./typescript/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
          verbose: true

      - name: Build
        working-directory: typescript
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies); same pip/ruff pins as before.
        run: python -m pip install --require-hashes -r .github/requirements/lint.txt

      - name: Run ruff
        run: ruff check src/ tests/

  dispatch-deploy:
    name: Trigger Deploy
    permissions:
      contents: read
    needs: [python, typescript, lint]
    if: >-
      always() &&
      github.event_name == 'push' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      # `client-id` is the current name for the input that used to be `app-id`: the action
      # reads `client-id || app-id` into one slot, and GitHub accepts an App ID or a Client
      # ID as the JWT `iss`, so this secret's value stays valid under the new key.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: mnemom

      - name: Commit subject
        id: commit
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: printf 'title=%s\n' "${HEAD_COMMIT_MESSAGE%%$'\n'*}" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: mnemom/deploy
          event-type: deploy
          client-payload: >-
            {
              "repo": "${{ github.event.repository.name }}",
              "sha": "${{ github.sha }}",
              "commit_title": ${{ toJSON(steps.commit.outputs.title) }},
              "environment": "${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
            }
