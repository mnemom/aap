name: Publish

# Thin caller for the canonical npm publish recipe — see ADR-020.
# All Node version, registry-url, OIDC, provenance, and SBOM logic lives in
# mnemom/.github/.github/workflows/npm-publish.yml. To change the recipe,
# edit the canonical workflow there; do not re-add steps inline here.
#
# Repo-specific logic that stays inline:
#   - validate: tag vs. typescript/package.json + pyproject.toml versions
#   - test: TypeScript build/typecheck/test + Python ruff/pytest
#   - publish-pypi: PyPI is a separate registry, not covered by the npm reusable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dispatch-id:
        description: "Correlation ID from deploy orchestrator"
        required: false
        type: string
      npm-directory:
        description: "Directory containing package.json to publish"
        required: false
        type: string
        default: "typescript"


permissions: {}
jobs:
  # ── Release-triggered: validate → test → (publish-npm, publish-pypi) ──

  validate:
    permissions:
      contents: read
    if: github.event_name == 'release'
    name: Validate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check Python version
        run: |
          PYPI_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$PYPI_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "ERROR: pyproject.toml version ($PYPI_VERSION) != tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi
      - name: Check npm version
        run: |
          NPM_VERSION=$(node -p "require('./typescript/package.json').version")
          if [ "$NPM_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "ERROR: package.json version ($NPM_VERSION) != tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

  test:
    permissions:
      contents: read
    if: github.event_name == 'release'
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: TypeScript checks
        working-directory: typescript
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      # Frozen, hash-verified install from uv.lock — the same resolution ci.yml's
      # python job gates on (OpenSSF Scorecard Pinned-Dependencies).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Python checks
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev pytest

  publish-pypi:
    name: Publish to PyPI
    needs: [validate, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC → PyPI Trusted Publisher
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          # Hash-pinned build frontend (OpenSSF Scorecard Pinned-Dependencies).
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  publish-npm:
    needs: [validate, test]
    if: github.event_name == 'release'
    permissions:
      contents: write   # for SBOM attach to GitHub Release
      id-token: write   # for npm OIDC Trusted Publisher
    # mnemom/.github @ scale/step-29-bump-node24-actions merge (ADR-020)
    uses: mnemom/.github/.github/workflows/npm-publish.yml@3b60e34e88113070235f2d55248a3455295be153
    with:
      npm-directory: typescript
      # Default branch serves the 2.x major, which is correctly `latest`. This
      # guard is belt-and-suspenders: if a v1.x release event ever resolves THIS
      # (default-branch) workflow, publish under the 1.x maintenance dist-tag so
      # npm `latest` is never dragged backward off 2.x. The 1.3.x line's own
      # publish.yml already pins legacy-1 unconditionally.
      tag: ${{ startsWith(github.event.release.tag_name, 'v1.') && 'legacy-1' || 'latest' }}

  # ── Orchestrator dispatch publishing ──

  dispatch-publish:
    if: github.event_name == 'workflow_dispatch'
    # contents: write is over-granted relative to what dispatch-publish does
    # (the `gh release upload` step in the reusable workflow is gated on
    # `event_name == 'release'` and never runs here). But GitHub validates
    # caller permissions against the called workflow's declared permissions
    # at workflow load time, before any `if:` is evaluated.
    permissions:
      contents: write
      id-token: write
    # mnemom/.github @ scale/step-29-bump-node24-actions merge (ADR-020)
    uses: mnemom/.github/.github/workflows/npm-publish.yml@3b60e34e88113070235f2d55248a3455295be153
    with:
      # Defensive defaults: GitHub validates `with:` expressions at load time,
      # before `if:` is evaluated. On a release event the `inputs` context is
      # empty; the `||` fallback keeps the expression valid on both event types.
      npm-directory: ${{ inputs.npm-directory || 'typescript' }}
      dispatch-id: ${{ inputs.dispatch-id || '' }}
      tag: latest
      attach-sbom-to-release: false   # dispatch path has no release to attach to
